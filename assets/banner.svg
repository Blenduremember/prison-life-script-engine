<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3a3f47" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b949e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b949e" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- Prison bars, kept low-opacity and away from text zone -->
  <g stroke="url(#barGrad)" stroke-width="10">
    <line x1="60" y1="0" x2="60" y2="360"/>
    <line x1="140" y1="0" x2="140" y2="360"/>
    <line x1="220" y1="0" x2="220" y2="360"/>
    <line x1="980" y1="0" x2="980" y2="360"/>
    <line x1="1060" y1="0" x2="1060" y2="360"/>
    <line x1="1140" y1="0" x2="1140" y2="360"/>
  </g>

  <!-- Faint spotlight circles -->
  <circle cx="150" cy="90" r="120" fill="#4d5560" opacity="0.08"/>
  <circle cx="1050" cy="280" r="150" fill="#4d5560" opacity="0.08"/>
  <circle cx="600" cy="40" r="200" fill="#5c6470" opacity="0.05"/>

  <!-- Thin horizontal accent lines suggesting a cell door -->
  <line x1="80" y1="60" x2="1120" y2="60" stroke="#8b949e" stroke-width="1" opacity="0.15"/>
  <line x1="80" y1="310" x2="1120" y2="310" stroke="#8b949e" stroke-width="1" opacity="0.15"/>

  <text x="600" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64.0" font-weight="700" fill="#ffffff">
    <tspan x="600" dy="0">Prison Life Script</tspan>
  </text>

  <text x="600" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Prison Life Script — a lightweight Windows tool.</tspan>
  </text>
</svg>